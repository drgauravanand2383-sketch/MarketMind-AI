name: Release

# Triggered by pushing a SemVer tag (see docs/release/UPGRADE_POLICY.md
# for the versioning scheme this project follows) — e.g. `git tag
# v1.0.0 && git push origin v1.0.0`. Builds and uploads every release
# artifact as a workflow artifact named after the tag; does not push to
# any container registry (none is assumed/configured by this project) —
# a later, deployment-specific step can `docker load` these images and
# push wherever that deployment's registry actually is.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  frontend:
    name: Frontend build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
        env:
          # Set these as repository variables (Settings → Secrets and
          # variables → Actions → Variables) before cutting a real
          # release — see docs/release/PRODUCTION_CONFIGURATION_GUIDE.md's
          # Frontend section. Falls back to a clearly-fake placeholder so
          # this workflow still runs (and still validates the build
          # succeeds) in a repo that hasn't configured them yet.
          VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.example.invalid/api/v1' }}
          VITE_WS_BASE_URL: ${{ vars.PRODUCTION_WS_BASE_URL || 'wss://api.example.invalid/ws' }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: frontend/dist
          retention-days: 90

  backend:
    name: Backend build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: backend
        run: uv sync --group dev
      - working-directory: backend
        run: uv run pytest tests
      - working-directory: backend
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.ref_name }}
          path: backend/dist
          retention-days: 90

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only placeholder .env for Compose validation
        # `docker-compose.prod.yml`'s `backend` service declares
        # `env_file: - .env` (implicitly required), and Compose also
        # reads a root `.env` for ${VAR} interpolation in both compose
        # files. Neither file is committed (see .env.example) or present
        # on a clean runner, so `docker compose config` fails outright
        # with "env file .../.env not found" before any of this job's
        # own port-hardening assertions ever run. These values are
        # harmless, deterministic CI placeholders — never real secrets,
        # never committed — that exist only to satisfy Compose's
        # interpolation/env_file requirements so the merged config below
        # can be produced and inspected.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci_placeholder_user
          POSTGRES_PASSWORD=ci_placeholder_password
          POSTGRES_DB=ci_placeholder_db
          REDIS_PASSWORD=ci_placeholder_password
          EOF
      - name: Verify production compose port hardening
        # Regression check for the docker-compose.prod.yml port-publication
        # bug: `ports: []` in an override does NOT clear ports inherited
        # from docker-compose.yml (`ports` is a Compose "unique resource"
        # key, not merged), so postgres/redis/chromadb were still
        # host-published in the merged config despite looking overridden.
        # Fixed via `ports: !reset []`. This exercises the real merge
        # through the actual Compose CLI, not just the override file's
        # source text, so it would have caught the original defect.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/compose-config.json
          for svc in postgres redis chromadb; do
            count=$(jq ".services.$svc.ports // [] | length" /tmp/compose-config.json)
            if [ "$count" -ne 0 ]; then
              echo "FAIL: $svc still publishes $count host port(s) in the merged production config"
              exit 1
            fi
          done
          backend_port=$(jq -r '.services.backend.ports[0] | "\(.published):\(.target)"' /tmp/compose-config.json)
          frontend_port=$(jq -r '.services.frontend.ports[0] | "\(.published):\(.target)"' /tmp/compose-config.json)
          if [ "$backend_port" != "8000:8000" ]; then
            echo "FAIL: backend port mapping is $backend_port, expected 8000:8000"
            exit 1
          fi
          if [ "$frontend_port" != "8080:8080" ]; then
            echo "FAIL: frontend port mapping is $frontend_port, expected 8080:8080"
            exit 1
          fi
          echo "PASS: production port hardening verified (postgres/redis/chromadb unpublished; backend 8000:8000; frontend 8080:8080)"
      - name: Remove CI-only placeholder .env
        # Only needed for the Compose validation above; the image build
        # steps below use `docker build` directly on ./backend and
        # ./frontend, which never read this root-level file.
        run: rm -f .env
      - name: Build backend image
        run: docker build -t marketmind-backend:${{ github.ref_name }} ./backend
      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ vars.PRODUCTION_API_BASE_URL || 'https://api.example.invalid/api/v1' }} \
            --build-arg VITE_WS_BASE_URL=${{ vars.PRODUCTION_WS_BASE_URL || 'wss://api.example.invalid/ws' }} \
            -t marketmind-frontend:${{ github.ref_name }} ./frontend
      - name: Verify frontend container healthcheck
        # Regression check for the frontend HEALTHCHECK bug: nginx's
        # `listen 8080;` (nginx.conf) binds IPv4 only, but the shipped
        # HEALTHCHECK probed `http://localhost:8080/`, and this image's
        # busybox wget resolves "localhost" to the IPv6 loopback (::1)
        # first — nothing listens there, so wget failed with "Connection
        # refused" even though nginx was serving correctly on 127.0.0.1.
        # Fixed by probing 127.0.0.1 explicitly. A source-text check of
        # the Dockerfile wouldn't catch this class of bug — it only shows
        # up when Docker actually runs the container's own HEALTHCHECK
        # CMD, which is what this step does.
        run: |
          docker run -d --name frontend-healthcheck-verify -p 18080:8080 marketmind-frontend:${{ github.ref_name }}
          status="starting"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' frontend-healthcheck-verify)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 3
          done
          if [ "$status" != "healthy" ]; then
            echo "FAIL: frontend container did not become healthy (status: $status)"
            docker logs frontend-healthcheck-verify
            docker inspect --format '{{json .State.Health}}' frontend-healthcheck-verify
            docker rm -f frontend-healthcheck-verify
            exit 1
          fi
          echo "PASS: frontend container reported healthy"
          docker rm -f frontend-healthcheck-verify
      - name: Save images
        run: |
          docker save marketmind-backend:${{ github.ref_name }} | gzip > marketmind-backend-${{ github.ref_name }}.tar.gz
          docker save marketmind-frontend:${{ github.ref_name }} | gzip > marketmind-frontend-${{ github.ref_name }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.ref_name }}
          path: |
            marketmind-backend-${{ github.ref_name }}.tar.gz
            marketmind-frontend-${{ github.ref_name }}.tar.gz
          retention-days: 90
