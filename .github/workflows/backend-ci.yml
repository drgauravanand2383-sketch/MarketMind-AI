name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  # Advisory only (`continue-on-error`), not a merge gate — the existing
  # codebase currently has substantial pre-existing ruff/mypy debt
  # (~1965 ruff findings as of Milestone 10) that predates this workflow
  # and is out of this milestone's scope to fix (no business-logic
  # changes). Still run and surfaced on every PR so debt is visible and
  # doesn't silently grow, without blocking unrelated work.
  lint:
    name: Ruff (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check .

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run mypy app

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      # The full suite uses fakes/in-memory repositories and a
      # throwaway SQLite database (see
      # tests/operations/test_alembic_environment.py) in place of real
      # Postgres/Redis/ChromaDB — no service containers needed here.
      - run: uv run pytest tests

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: backend/dist
          retention-days: 14
