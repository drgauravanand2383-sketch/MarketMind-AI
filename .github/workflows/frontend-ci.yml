name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # These two are never actually read by `vite build` itself (Vite
      # doesn't execute app code at build time, only statically replaces
      # `import.meta.env.VITE_*` references) — set here purely so the
      # uploaded artifact is a realistic, representative build rather
      # than one baked with no backend URL at all.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
          VITE_WS_BASE_URL: wss://api.example.invalid/ws
      - uses: actions/upload-artifact@v4
        with:
          # Release artifact naming: `<component>-<git-sha>` for every
          # push/PR build; a tagged release additionally names its own
          # artifacts `<component>-v<version>` — see .github/workflows/release.yml.
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 14
