[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone-naive timestamps are never used anywhere else in this codebase
# (every domain model uses tz-aware datetimes) — Alembic's own revision
# file naming has no timestamp by default, so this is left unset.

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
revision_environment = false

# version path separator; As mentioned above, this is the character used to split
# version_locations.
version_path_separator = os

# `sqlalchemy.url` is intentionally left unset here: `alembic/env.py`
# constructs the connection URL from `app.config.models.PostgreSQLSettings`
# at runtime (the same settings class every `build_*_repository` function
# in `app.bootstrap` already reads) — a single source of truth for
# database connection configuration, never duplicated into this file.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
