# MarketMind AI Frontend — production nginx config.
#
# Listens on 8080 (not the privileged port 80) because the container
# runs as the non-root `nginx` user (see ../Dockerfile) — binding <1024
# requires root. Put a reverse proxy / load balancer in front of this
# for TLS termination and the public 443 port, same as
# docs/release/DEPLOYMENT_GUIDE.md already documents for the backend —
# this container does not terminate TLS itself either.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always-on security headers — mirrors the backend's own
    # SECURITY_HEADERS_* middleware (docs/release/SECURITY_CONSIDERATIONS.md)
    # so both halves of the app send a consistent baseline. Content-Security-Policy
    # and Strict-Transport-Security are deliberately omitted here for the
    # same reason the backend leaves them disabled by default: HSTS is
    # actively wrong to send without TLS, and a default CSP would need
    # tuning per deployment (it must allow connect-src to this build's
    # own VITE_API_BASE_URL/VITE_WS_BASE_URL) before it's safe to turn on
    # — see docs/release/PRODUCTION_CONFIGURATION_GUIDE.md's Frontend
    # section for how to add both once you know your real origins.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Vite fingerprints every built asset filename with a content hash
    # (e.g. index-Ab12Cd34.js) — safe to cache forever, since a changed
    # file is always a differently-named file.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html itself must never be cached — it's what references the
    # current build's hashed asset filenames, and a stale cached copy
    # would keep loading a deleted, previous deployment's assets.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routing (TanStack Router) — any path that isn't a real
    # static file falls back to index.html so a hard refresh or a direct
    # deep link (e.g. /watchlists/abc) resolves client-side instead of a
    # raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
